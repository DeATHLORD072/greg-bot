name: Greg Gemini Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install google-genai

      - run: python gemini_test.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
